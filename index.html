<style>
body{margin:0;background:#DAE0EE}
a{color:#454A8C}a:hover{color:#2D315F}
.me{background-image:url(assets/me-typing.png);background-repeat:no-repeat;image-rendering:pixelated}
.bubble{position:absolute;left:50%;bottom:350px;z-index:6;transform:translateX(-50%);transform-origin:50% 100%;pointer-events:none;animation:bubbleIn .38s cubic-bezier(.2,1.4,.4,1) both}
.bubble.out{animation:bubbleOut .26s ease-in both}
@keyframes bubbleIn{from{transform:translateX(-50%) translateY(40px) scale(.1);opacity:0}to{transform:translateX(-50%) translateY(0) scale(1);opacity:1}}
@keyframes bubbleOut{to{transform:translateX(-50%) translateY(30px) scale(.2);opacity:0}}
.bubble-card{display:flex;align-items:center;gap:20px;width:max-content;max-width:min(520px,calc(100vw - 32px));box-sizing:border-box;padding:14px 26px 14px 14px;border-radius:22px;box-shadow:0 16px 40px rgba(20,14,60,.22)}
.bubble-tail{position:absolute;left:50%;bottom:-11px;width:22px;height:22px;transform:translateX(-50%) rotate(45deg);border-radius:3px}
.bubble-ava{width:104px;height:104px;flex:none;border-radius:18px;background:#E8D9FB;overflow:hidden}
.bubble-ava img{width:100%;height:100%;display:block;image-rendering:pixelated}
.bubble-name{font-family:'Press Start 2P',monospace;font-size:14px;line-height:1.4;margin-bottom:12px}
.bubble-text{font-family:'Press Start 2P',monospace;font-size:13px;line-height:1.9;max-width:300px}
.me-big{width:340px;height:348px;background-size:1360px 348px;animation:typeBig .48s steps(4) infinite}
@keyframes typeBig{to{background-position:-1360px 0}}
@media (min-width:761px) and (max-width:1240px), (min-width:761px) and (max-height:900px){.me-big{width:256px;height:262px;background-size:1024px 262px;animation-name:typeBigM}.me-shadow{width:136px !important;height:20px !important}.bubble{bottom:266px}}
@keyframes typeBigM{to{background-position:-1024px 0}}
.pix{image-rendering:pixelated}
.spot{position:absolute;top:-40px;bottom:0;width:780px;max-width:120vw;z-index:0;pointer-events:none;clip-path:polygon(13% 0,87% 0,100% 100%,0 100%);background:linear-gradient(180deg,rgba(178,158,72,.85) 0%,rgba(160,140,78,.55) 35%,rgba(150,130,90,.22) 60%,rgba(140,120,110,0) 80%);filter:blur(22px)}
.scene{transition:background-color .6s}
.scene{letter-spacing:-0.03em}
.bubble-name,.bubble-text,.mute-text,.clock,.bill,.pop,.lvl,.rc-title,.rc-lead,.rc-amount,.ic-title,.ic-rush b,.key,.ic-keylabel,.ic-noise-label,.kbd,.hud{letter-spacing:normal}
/* Press Start 2P has a full-width space: tighten word gaps so they don't read as double spaces */
.rc-lead,.rc-amount,.rc-title,.ic-title,.ic-rush b,.hud,.bubble-text,.ic-noise-label{word-spacing:-0.5em}
/* textured pixel gradients: Bayer-dithered strips, each pixel shown as a crisp 4px block */
.bgtex{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;background-repeat:repeat-x;background-size:32px 100%;image-rendering:pixelated}
.bg-day{background-image:url(assets/bg-day.png)}
.bg-sunset{background-image:url(assets/bg-sunset.png)}
.bg-night{background-image:url(assets/bg-night.png)}
.topbar{width:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;column-gap:max(24px,3vw);row-gap:clamp(12px,2.2vh,22px);position:relative;z-index:3}
.toolbar{display:flex;align-items:center;gap:6px;justify-self:start;min-width:0}
.title{margin-top:clamp(22px,3.4vh,40px) !important}
.theme-seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;box-shadow:inset 0 0 0 1.5px var(--ink-soft)}
.tbtn{display:inline-flex;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--ink);font-family:'Google Sans Flex',sans-serif;font-weight:600;font-size:12px;letter-spacing:-0.03em;text-transform:uppercase;cursor:pointer}
.tbtn:hover{background:var(--ink-soft)}
.tbtn.on{background:var(--ink);color:var(--on-ink)}
.tbtn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.tbtn:disabled{opacity:.45;cursor:default}
.mute{position:relative;display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 10px 0 2px;border:0;border-radius:10px;background:transparent;color:var(--ink);font-family:'Press Start 2P',monospace;font-weight:400;font-size:11px;cursor:pointer}
.mute-ico{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--on-ink)}
.mute:hover{background:var(--ink-soft)}
.mute:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.topnote{justify-self:center;display:flex;align-items:center;gap:6px;white-space:nowrap;font-family:'Google Sans Flex',sans-serif;font-weight:400;font-size:22px;letter-spacing:-0.03em;color:var(--ink)}
.behance{display:inline-flex;align-items:center;gap:6px;color:var(--ink) !important;font-weight:600;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:5px;border-radius:4px}
.behance:hover{color:var(--ink-hover) !important}
.behance:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.clock{justify-self:end;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.4;color:var(--ink);pointer-events:none;white-space:nowrap;font-variant-numeric:tabular-nums}
.plant{height:190px;width:auto}
/* tablets & short laptops: plants pushed right to the screen edges to free the floor */
@media (min-width:761px) and (max-width:1240px), (min-width:761px) and (max-height:900px){.plant{height:156px}.plant-a{left:-36px !important}.plant-c{right:-32px !important}.plant-b{right:calc(-32px + 96px) !important}}
@media (max-width:760px){.plant{height:114px}
/* phones: edge plants tucked into the screen corners, only half showing */
.plant-a{left:-16px !important;transform:translateX(-50%)}
.plant-c{right:-16px !important;transform:translateX(50%)}
.plant-b{display:none}}
.scene:focus{outline:none}
.scene.playing{touch-action:none;user-select:none;-webkit-user-select:none}
.bill{position:absolute;left:0;top:0;width:100px;height:46px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-family:'Press Start 2P',monospace;font-weight:400;font-size:13px;border:3px solid #2D315F;box-shadow:4px 4px 0 rgba(45,49,95,.35),inset 0 0 0 3px rgba(255,255,255,.45);will-change:transform;pointer-events:none}
.b50{background:#BFE6C6;color:#1E4A2A}
.b100{background:#86CF9C;color:#143A21}
.b300{background:#F6D27A;color:#4A3500}
.b500{background:#F3AACB;color:#4E1530}
.pop{position:absolute;left:0;top:0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:15px;color:var(--ink);pointer-events:none;white-space:nowrap}
.btn{font-family:'Google Sans Flex',sans-serif;font-weight:600;font-size:17px;padding:14px 26px;min-height:50px;background:var(--ink);color:var(--on-ink);border:0;border-radius:999px;cursor:pointer}
.btn:hover{background:var(--ink-hover)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn-ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 2px var(--ink)}
.btn-ghost:hover{background:var(--ink-soft)}
.obs{position:absolute;left:0;bottom:6px;width:auto;image-rendering:pixelated;pointer-events:none;will-change:transform}
.lvl{font-family:'Press Start 2P',monospace;font-weight:400;font-size:11px;padding:7px 12px;border-radius:999px;background:var(--ink);color:var(--on-ink)}
.fail{color:#B3263E}
/* result popup (Figma: fail / woke-up-wife / shift's over) */
.rc{gap:16px}
.rc-pic{display:block;width:220px;height:auto;image-rendering:pixelated}
.rc-title{margin:0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:22px;line-height:1.45}
.rc-score{display:flex;flex-direction:column;align-items:center;gap:8px}
.rc-lead{margin:0;font-family:'Press Start 2P',monospace;font-size:11px;line-height:1.6;color:var(--ink)}
.rc-amount{font-family:'Press Start 2P',monospace;font-size:34px;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums}
.rc-best{margin:0;font-size:13px;color:var(--sub)}
.rc-panel{gap:14px;padding:20px 18px}
.rc-pitch{margin:0;font-size:16px !important;line-height:1.4;color:var(--ink) !important;font-weight:500}
.rc-talk{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:50px;border-radius:999px;background:var(--ink);color:var(--on-ink) !important;font-weight:600;font-size:17px;text-decoration:none}
.rc-talk:hover{background:var(--ink-hover)}
.rc-socials{display:flex;gap:10px;justify-content:center}
.rc-social{--rc-social-bg:var(--panel);display:inline-flex;align-items:center;justify-content:center;width:54px;height:44px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--ink);color:var(--ink) !important}
.rc-social:hover{background:var(--ink-soft)}
.rc-again{box-sizing:border-box;padding:0;display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 38px);align-self:center;min-height:52px;border-radius:999px;border:2px solid var(--ink);background:transparent;color:var(--ink);font-family:inherit;font-weight:600;font-size:17px;cursor:pointer;margin-top:4px}
.rc-again:hover{background:var(--ink-soft)}
.rc-menu{display:flex;align-items:center;justify-content:center;gap:10px;width:calc(100% - 38px);align-self:center;min-height:52px;box-sizing:border-box;border-radius:999px;border:2px solid transparent;background:transparent;color:var(--ink);font-family:inherit;font-weight:600;font-size:17px;padding:0;cursor:pointer}
.rc-menu:hover{background:var(--ink-soft)}
.rc-talk:focus-visible,.rc-social:focus-visible,.rc-again:focus-visible,.rc-menu:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:460px){.rc-pic{width:170px}.rc-amount{font-size:28px}.rc-title{font-size:18px}}

/* rules popup (from the Figma frames, scaled up to the earlier popup text sizes) */
.ic{width:100%;max-width:440px;box-sizing:border-box;padding:32px 32px 28px;border-radius:24px;box-shadow:0 24px 60px rgba(20,14,60,.28);display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;color:var(--ink);font-family:'Google Sans Flex',sans-serif}
.ic-tiles{display:flex;gap:8px}
.ic-tiles img{display:block;width:180px;height:76px;image-rendering:pixelated}
.ic-tile{display:block;width:130px;height:147px;image-rendering:pixelated}
.ic-title{margin:0;font-family:'Press Start 2P',monospace;font-weight:400;font-size:22px;line-height:1.5;color:var(--ink)}
.ic-rush{display:flex;flex-direction:column;gap:6px;margin-top:-8px;font-size:15px;line-height:1.3;color:#F27E97}
.ic-rush strong{color:#EE5576;font-weight:700}
.ic-rush b{font-family:'Press Start 2P',monospace;font-weight:400;font-size:13px}
.ic-panel{width:100%;box-sizing:border-box;padding:18px 18px 16px;border-radius:20px;background:var(--panel);border:1px solid var(--panel-border);display:flex;flex-direction:column;align-items:center;gap:12px}
.ic-panel p{margin:0;font-size:16px;line-height:1.55;color:var(--sub)}
.ic-panel p.ic-strong{font-weight:700;color:var(--ink)}
.key{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;box-sizing:border-box;border:2px solid var(--ink);border-radius:6px;box-shadow:0 3px 0 var(--ink);font-family:'Press Start 2P',monospace;font-size:11px;color:var(--ink);background:var(--panel);vertical-align:middle}
.key-sm{height:24px;font-size:9px;padding:0 6px;box-shadow:0 2px 0 var(--ink)}
.key-wide{min-width:68px}
.ic-keys{display:flex;align-items:center;justify-content:center;gap:8px}
.ic-keylabel{font-family:'Press Start 2P',monospace;font-size:11px;color:var(--ink);margin:0 12px 0 4px}
.ic-touch{margin:0;display:none;font-size:15px;color:var(--sub)}
.ic-noise{display:flex;align-items:center;gap:10px}
.ic-noise-label{font-family:'Press Start 2P',monospace;font-size:14px;color:var(--ink);margin-right:2px}
.ic-bar{position:relative;display:inline-block;width:170px;height:17px;box-sizing:border-box;border:2px solid var(--ink);border-radius:3px;background:#1C173A;overflow:hidden}
.ic-bar-fill{position:absolute;left:0;top:0;bottom:0;width:62%;background:var(--ink)}
.ic-bar-red{position:absolute;right:0;top:0;bottom:0;width:24%;background:#F8657C}
.ic-dot{width:14px;height:14px;box-sizing:border-box;border-radius:50%;border:2px solid #F8657C}
.ic-dot.on{background:#F8657C}
.ic-actions{display:flex;gap:14px;width:100%;margin-top:4px}
.ic-btn{flex:1;min-height:52px;border-radius:999px;font-family:'Google Sans Flex',sans-serif;font-weight:600;font-size:17px;cursor:pointer}
.ic-btn-main{border:2px solid var(--ink);background:var(--ink);color:var(--on-ink)}
.ic-btn-main:hover{background:var(--ink-hover);border-color:var(--ink-hover)}
.ic-btn-ghost{border:2px solid var(--ink);background:transparent;color:var(--ink)}
.ic-btn-ghost:hover{background:var(--ink-soft)}
.ic-btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
@media (max-width:460px){.ic{padding:24px 20px 22px;gap:16px}.ic-title{font-size:18px}.ic-panel p{font-size:14px}.ic-tiles img{width:150px;height:63px}.ic-tile{width:104px;height:117px}.ic-bar{width:120px}}

.btn-play{display:inline-flex;align-items:center;justify-content:center;gap:14px;min-height:52px;padding:0 52px 0 54px;font-family:'Google Sans Flex',sans-serif;font-weight:500;font-size:19px;letter-spacing:-0.03em;text-transform:uppercase}
.seg-main .seg-btn{font-family:'Google Sans Flex',sans-serif;font-weight:500;font-size:19px;min-height:44px;padding:0 20px}
.seg-main{box-shadow:inset 0 0 0 2px var(--ink)}
.card .fail{color:var(--danger)}
.seg{display:inline-flex;padding:4px;gap:4px;border-radius:999px;box-shadow:inset 0 0 0 2px var(--ink)}
.seg-btn{font-family:'Google Sans Flex',sans-serif;font-weight:600;font-size:16px;min-width:84px;min-height:42px;padding:8px 18px;border:0;border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.seg-btn:hover{background:var(--ink-soft)}
.seg-btn.on{background:var(--ink);color:var(--on-ink)}
.seg-btn:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:30px;height:30px;padding:0 8px;box-sizing:border-box;border:2px solid var(--ink);border-radius:6px;font-family:'Press Start 2P',monospace;font-weight:400;font-size:10px;box-shadow:0 3px 0 var(--ink)}
.pad{display:none}
.pad-btn{width:72px;height:72px;border-radius:50%;border:2px solid var(--ink);background:var(--on-ink);color:var(--ink);display:flex;align-items:center;justify-content:center;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;box-shadow:0 6px 16px rgba(20,14,60,.25)}
.pad-btn:active{background:var(--ink);color:var(--on-ink)}
@media (hover:none){.pad{display:flex}.keys-hint{display:none !important}.touch-hint{display:flex !important}.ic-touch{display:block !important}}
.scene{min-height:100svh !important}
.pad-btn{opacity:.88}
@media (max-width:1240px){.topbar{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.toolbar{grid-column:1;grid-row:1}.clock{grid-column:2;grid-row:1}.topnote{grid-column:1/-1;grid-row:2;flex-wrap:wrap;justify-content:center;white-space:normal;text-align:center}}
@media (max-width:760px){
.scene{padding:10px 12px 0 !important}
.title{margin-top:clamp(14px,2.4svh,24px) !important}
.topbar{row-gap:10px}
.topnote{justify-content:center;flex-wrap:wrap;white-space:normal;text-align:center;gap:8px 12px;font-size:13px}
.title{white-space:normal !important;font-size:clamp(48px,min(25vw,12.5svh),150px) !important;line-height:0.86 !important}
/* phones: the whole scene fits one screen, no scrolling needed to reach the game */
.scene{height:100svh;min-height:0 !important}
.spacer{min-height:8px !important}
.spot{width:min(300px,78vw) !important;filter:blur(12px) !important}
.toolbar{gap:2px}.mute{padding:0 10px}.tbtn{min-width:32px;height:32px;padding:0 8px}
.mute-text{display:none}
.clock{padding-right:4px}
.clock-label{display:none}
.floor{height:min(260px,30svh) !important}
.hud{gap:14px !important;font-size:14px !important;flex-wrap:wrap;justify-content:center}
.noise-bar{width:96px !important}
.card{padding:26px 20px 22px !important;gap:12px !important;border-radius:16px !important}
.card h2{font-size:19px !important}
.btn{font-size:16px;padding:13px 22px}
.seg-btn{min-width:72px}
.btn-play{padding:0 30px 0 32px;font-size:17px;gap:12px}
.pad-btn{width:68px;height:68px}
}
@media (max-width:760px){.bubble{bottom:178px}.bubble-ava{width:72px;height:72px;border-radius:14px}.bubble-card{gap:14px;padding:10px 16px 10px 10px}.bubble-name{font-size:11px;margin-bottom:8px}.bubble-text{font-size:10px;max-width:210px}.me-big{width:170px;height:174px;background-size:680px 174px;animation-name:typeBigS}.bill{width:56px;height:28px;font-size:8px;border-width:2px;box-shadow:2px 2px 0 rgba(45,49,95,.35),inset 0 0 0 2px rgba(255,255,255,.45)}.pop{font-size:11px}.plant-l{width:80px !important}.plant-r{width:124px !important}}
@media (max-width:760px){.me-shadow{width:100px !important;height:16px !important}}
@keyframes typeBigS{to{background-position:-680px 0}}
</style>

<body>
<div id="root"></div>

<!-- Page markup: {{holes}} are filled from renderVals(), <sc-if>/<sc-for> are conditionals and loops -->
<template id="dc-template">
<main class="{{sceneClass}}" ref="{{setArena}}" tabIndex="0" onKeyDown="{{onKeyDown}}" onKeyUp="{{onKeyUp}}" onBlur="{{onBlur}}" onTouchStart="{{tStart}}" onTouchMove="{{tMove}}" onTouchEnd="{{tEnd}}" onTouchCancel="{{tEnd}}" style="--ink: {{ink}}; --on-ink: {{onInk}}; --ink-hover: {{inkHover}}; --ink-soft: {{inkSoft}}; --sub: {{sub}}; position: relative; min-height: 100vh; overflow: hidden; box-sizing: border-box; background-color: {{bg}}; color: {{ink}}; font-family: 'Google Sans Flex', sans-serif; display: flex; flex-direction: column; align-items: center; padding: 28px 28px 0">
<sc-if value="{{bgDay}}" hint-placeholder-val="{{ true }}"><div class="bgtex bg-day" aria-hidden="true"></div></sc-if>
<sc-if value="{{bgSunset}}" hint-placeholder-val="{{ false }}"><div class="bgtex bg-sunset" aria-hidden="true"></div></sc-if>
<sc-if value="{{bgNight}}" hint-placeholder-val="{{ false }}"><div class="bgtex bg-night" aria-hidden="true"></div></sc-if>

<sc-if value="{{isNight}}" hint-placeholder-val="{{ false }}">
<div class="spot" aria-hidden="true" style="left: 50%; transform: translateX(-50%)"></div>
</sc-if>

<audio ref="{{setMusic}}" src="assets/music.mp3" loop="" preload="auto" aria-hidden="true"></audio>
<div class="topbar">
<div class="toolbar">
<button class="mute" type="button" onClick="{{toggleMute}}" aria-label="{{muteLabel}}" aria-pressed="{{mutedStr}}">
<sc-if value="{{soundOn}}" hint-placeholder-val="{{ true }}">
<span class="mute-ico"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4V5z"></path><path d="M15.5 8.5a5 5 0 0 1 0 7"></path><path d="M18.5 5.5a9 9 0 0 1 0 13"></path></svg></span>

<script>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.noise = 0; this.strikes = 0; this.inDanger = false; this.nightMode = false;
    this.state = { running: false, over: false, failed: false, level: 1, score: 0, caught: 0, missed: 0, timeLeft: 0, bills: [], pops: [], obs: [], px: null, jump: 0, best1: 0, best2: 0 };
    this.plants = [
      // h = the same height the plant has standing in the scene
      { src: 'assets/plant-palm.png', ratio: 524 / 808, h: 190 },
      { src: 'assets/plant-ficus.png', ratio: 332 / 608, h: 190 },
      { src: 'assets/plant-zz.png', ratio: 552 / 956, h: 190 }
    ];
    this.plantEls = [null, null, null];
    this.setP0 = (el) => { this.plantEls[0] = el; };
    this.setP1 = (el) => { this.plantEls[1] = el; };
    this.setP2 = (el) => { this.plantEls[2] = el; };
    this.arena = null; this.meEl = null; this.raf = null; this.nextId = 1;
    this.keys = { left: false, right: false };
    this.px = null; this.jump = 0; this.vy = 0;
    this.types = [
      { v: 50, p: 0.42, s: [150, 200] },
      { v: 100, p: 0.30, s: [180, 240] },
      { v: 300, p: 0.18, s: [230, 300] },
      { v: 500, p: 0.10, s: [290, 360] }
    ];
    this.setArena = (el) => { this.arena = el; };
    this.setMe = (el) => { this.meEl = el; };
    this.onKeyDown = (e) => {
      const k = e.key;
      // popups (rules / result) answer to the mouse only: swallow Space/Enter so a stray key
      // (or a still-held jump) can't restart the game or press a focused button
      if (this.state.intro || this.state.over) {
        if (k === ' ' || k === 'Spacebar' || k === 'Enter' || k === 'ArrowUp') e.preventDefault();
        this.keys.left = false; this.keys.right = false;
        return;
      }
      if (k === 'ArrowLeft' || k === 'a' || k === 'ф') { this.keys.left = true; this.lastDir = -1; e.preventDefault(); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'в') { this.keys.right = true; this.lastDir = 1; e.preventDefault(); }
      else if (k === 'Escape') { if (this.state.running) { e.preventDefault(); this.finish(); } else if (this.state.intro) { e.preventDefault(); this.cancelIntro(); } }
      else if (k === ' ' || k === 'ArrowUp' || k === 'Spacebar') {
        if (e.target && e.target.tagName === 'BUTTON' && !this.state.running) return;
        e.preventDefault();
        if (this.state.running) this.doJump(); else if (this.state.dialog) this.endDialog(true); else if (this.state.intro) this.startDialog(this.state.level); else if (this.state.over) this.startGame(this.state.level); else this.play();
      }
    };
    this.onKeyUp = (e) => {
      const k = e.key;

        pops.push({ id: this.nextId++, v: 0, label: 'SHHH!', x0: this.px - 40, y0: H - mh - 40 - this.jump, born: t });
      }
      this.inDanger = t < (this.redUntil || 0);
    }

    // spawn
    this.acc += dt;
    const interval = 700 - 340 * prog;
    while (this.acc >= interval && timeLeft > 0) {
      this.acc -= interval;
      const ty = this.pickType();
      const v = (ty.s[0] + Math.random() * (ty.s[1] - ty.s[0])) * (1 + 0.35 * prog) * Math.max(0.8, H / 900) * (this.speedMul || 1);
      const bx = 20 + Math.random() * Math.max(10, W - 140);
      bills.push({ id: this.nextId++, v: ty.v, bx, x: bx, y: -56, vy: v, ph: Math.random() * 6.28, sway: 10 + Math.random() * 20, rot: 0 });
    }

    // catch zone: monitor, head and desk top
    const hl = this.px - mw * 0.4, hr = this.px + mw * 0.4;
    const top = H - 6 - mh - this.jump;
    const bottom = top + mh * 0.6;
    const keep = [];
    for (const b of bills) {
      b.y += b.vy * sec;
      b.ph += dt / 300;
      b.x = b.bx + Math.sin(b.ph) * b.sway;
      b.rot = Math.round(Math.sin(b.ph) * 8);
      const bw = W < 760 ? 56 : 100, bh = W < 760 ? 28 : 46; // bills are half-size on phones
      const hit = b.x < hr && b.x + bw > hl && b.y + bh > top + 6 && b.y < bottom;
      if (hit) {
        score += b.v; caught += 1;
        pops.push({ id: b.id, v: b.v, x0: b.x + 10, y0: b.y - 10, born: t });
        this.sfx('coin', b.v);
        continue;
      }
      if (b.y > H - 30) { missed += 1; continue; }
      keep.push(b);
    }
    pops = pops.filter((p) => t - p.born < 800);

    // level 2: plants slide along the floor — jump over them
    const level = this.state.level;
    let obs = this.state.obs;
    let failed = false;
    if (level === 2) {
      obs = obs.slice();
      const scale = W < 760 ? 0.6 : 1;
      this.obsAcc += dt;
      if (this.obsAcc >= this.nextObs && timeLeft > 1200) {
        this.obsAcc = 0;
        this.nextObs = ((2600 - 1100 * prog) + Math.random() * 1000) * (this.nightMode ? 1.35 : 1);
        const pl = this.plants[Math.floor(Math.random() * this.plants.length)];
        const fromLeft = true; // the floor is a conveyor moving right
        const oh = Math.round(pl.h * scale);
        const w = Math.round(oh * pl.ratio);
        const sp = (290 + Math.random() * 80) * (1 + 0.25 * prog) * Math.max(0.75, W / 1400);
        obs.push({ id: this.nextId++, src: pl.src, h: oh, w, b: 6, x: fromLeft ? -w - 10 : W + 10, vx: fromLeft ? sp : -sp, flip: 1, wait: 0 });
      }
      const pl = this.px - mw * 0.18, pr = this.px + mw * 0.18;
      const nextObs = [];
      for (const o of obs) {
        if (o.wait > 0) { o.wait -= dt; nextObs.push(o); continue; }
        if (o.b > 6) o.b = Math.max(6, o.b - 160 * sec);
        o.x += o.vx * sec;
        if (o.x < -o.w - 40 || o.x > W + 40) continue;
        const ol = o.x + o.w * 0.25, orr = o.x + o.w * 0.75;
        if (!o.harmless && ol < pr && orr > pl && this.jump < o.h * 0.7) { failed = true; failReason = 'plant'; }
        nextObs.push(o);
      }
      obs = nextObs;
    }

    if (!failed && this.nightMode && this.strikes >= 3) { failed = true; failReason = 'noise'; }
    if (!failed && edgeFail) { failed = true; failReason = 'edge'; }
    if (timeLeft <= 0 || failed || this.endReq) {
      this.sfx(failed ? 'fail' : 'end');
      this.musicStop(false);
      this.endReq = false;
      const key = level === 2 ? 'best2' : 'best1';
      let best = this.state[key];
      if (score > best) { best = score; try { window.localStorage.setItem(level === 2 ? 'coming-soon-best-2' : 'coming-soon-best', String(best)); } catch (err) {} }
      this.raf = null; this.isRunning = false; this.jump = 0; this.vy = 0;
      this.setState({ running: false, over: true, failed, failReason, score, caught, missed, bills: [], pops: [], obs: [], timeLeft: 0, [key]: best, px: this.px, jump: 0 });
      return;
    }
    this.setState({ bills: keep, pops, obs, score, caught, missed, timeLeft, noise: Math.round(this.noise), strikes: this.strikes, hits: this.hits, blink: t < this.invulnUntil ? (Math.floor(t / 100) % 2) : 0, inDanger: this.inDanger, px: Math.round(this.px), jump: Math.round(this.jump) });
    this.raf = requestAnimationFrame(this.tick);
  }
  fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  renderVals() {
    const s = this.state;
    const secs = s.running ? Math.ceil(s.timeLeft / 1000) : (s.over ? 0 : this.roundMs() / 1000);
    const now = (typeof performance !== 'undefined') ? performance.now() : 0;
    let verdict = 'Not bad for a start!';
    if (s.score >= 4000) verdict = 'You’re hired. Seriously.';
    else if (s.score >= 2500) verdict = 'Now that’s productivity!';
    else if (s.score >= 1200) verdict = 'That’s a new monitor right there.';
    else if (s.score === 0) verdict = 'Every bill flew right past.';
    // character follows the game only while playing (and under the result popup); main screen = always centred
    const placed = s.px != null && (s.running || s.over);
    return {
      ...this.amountType(),
      introHard: s.level === 2,
      introNightOnly: s.level !== 2,
      introTitle: s.level === 2 ? (this.palette().isNight ? 'Don’t wreck the plants & don’t wake my wife!' : 'Don’t wreck the plants!') : (this.palette().isNight ? 'Mind the plants & don’t wake my wife!' : 'Mind the plants!'),
      introRule: s.level === 2 ? 'The floor is about to start moving. Plants will ride in from the left — jump over them with' : 'Catch the falling cash, but don’t bump into the plants on the sides — jump over them with',
      introRuleBold: s.level === 2 ? 'Crash into one and it’s game over' : 'Bump into one and it’s game over',
      introTileOne: !this.palette().isNight,
      introTileSrc: this.themeName() === 'sunset' ? 'assets/tile-sunset.png' : 'assets/tile-day.png',
      isSunset: this.themeName() === 'sunset',
      easyTitle: this.palette().isNight ? 'Mind the plants & don’t wake my wife!' : 'Mind the plants!',
      hardTitle: this.palette().isNight ? 'Don’t wreck the plants & don’t wake my wife!' : 'Don’t wreck the plants!',
      meOpacity: s.running && s.blink ? 0.35 : 1,
      nightMode: !!s.nightMode && s.running,
      noisePct: s.inDanger ? 100 : Math.round(s.noise || 0),
      noiseColor: s.inDanger ? '#FF5C78' : ((s.noise || 0) > 55 ? '#FF9F43' : 'var(--ink)'),
      strike1: (s.strikes || 0) >= 1 ? '#FF6B86' : 'transparent',
      strike2: (s.strikes || 0) >= 2 ? '#FF6B86' : 'transparent',
      strike3: (s.strikes || 0) >= 3 ? '#FF6B86' : 'transparent',
      failPlant: s.over && s.failed && s.failReason === 'plant',
      failEdge: s.over && s.failed && s.failReason === 'edge',
      failNoise: s.over && s.failed && s.failReason === 'noise',
      ...this.resultVals(s),
      failMe: s.over && s.failed && s.failReason !== 'noise',
      failTitle: s.failReason === 'noise' ? 'You woke up my wife!' : 'Fail!',
      muted: !!s.muted, soundOn: !s.muted, mutedStr: s.muted ? 'true' : 'false',
      muteText: s.muted ? 'Sound Off' : 'Sound On', muteLabel: s.muted ? 'Turn sound on' : 'Turn sound off',
      toggleMute: this.toggleMute, setMusic: this.setMusic,
      ...this.palette(),
      ...this.cardColors(),
      bgDay: this.palette().bgClass === 'bg-day', bgSunset: this.palette().bgClass === 'bg-sunset', bgNight: this.palette().bgClass === 'bg-night',
      clockText: this.state.clockText || this.clockNow(),
      roundSec: this.roundMs() / 1000,
      running: s.running,
      over: s.over,
      showStart: !s.running && !s.over && !s.intro && !s.dialog,
      dialog: !!s.dialog,
      bubbleClass: s.dialogOut ? 'bubble out' : 'bubble',
      avatarSrc: this.dialogAva,
      ...(() => { const cur = this.themeName(); const o = {}; for (const [k, n] of [['day', 'Day'], ['sunset', 'Sunset'], ['night', 'Night']]) { o['t' + n + 'Cls'] = cur === k ? 'tbtn on' : 'tbtn'; o['t' + n + 'On'] = cur === k ? 'true' : 'false'; } return o; })(),
      pickDay: this.pickDay, pickSunset: this.pickSunset, pickNight: this.pickNight,
      dialogShown: this.dialogLine.slice(0, s.dialogN || 0),
      dialogRest: this.dialogLine.slice(s.dialogN || 0),
      bubbleName: this.palette().isNight ? '#E0BB54' : '#1B1630',
      easyClass: s.level === 1 ? 'seg-btn on' : 'seg-btn', hardClass: s.level === 2 ? 'seg-btn on' : 'seg-btn',
      easyOn: s.level === 1 ? 'true' : 'false', hardOn: s.level === 2 ? 'true' : 'false',
      lvlName: s.level === 2 ? 'HARD' : 'EASY', lvlLower: s.level === 2 ? 'Hard' : 'Easy',
      intro: !!s.intro && !s.running,
      sceneClass: s.running ? 'scene playing' : 'scene',
      scoreText: this.fmt(s.score),
      bestText: this.fmt(s.level === 2 ? s.best2 : s.best1),
      level: s.level,
      failed: s.over && s.failed,
      won: s.over && !s.failed,
      otherLabel: s.level === 1 ? 'Level 2 →' : '← Level 1',
      obs: s.obs.map((o) => ({ id: o.id, src: o.src, h: o.h, b: Math.round(o.b ?? 6), x: Math.round(o.x), flip: o.flip })),
      decorVis: (s.running && s.level === 2) ? 'hidden' : 'visible',
      setP0: this.setP0, setP1: this.setP1, setP2: this.setP2,
      verdict,
      timeText: Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0'),
      meLeft: placed ? s.px + 'px' : '50%',
      meTx: '-50%',
      meTy: -(s.jump || 0),
      shTx: '-50%',
      shScale: Math.max(0.45, 1 - (s.jump || 0) / 260).toFixed(2),
      bills: s.bills.map((b) => ({ id: b.id, v: b.v, x: Math.round(b.x), y: Math.round(b.y), rot: b.rot })),
      pops: s.pops.map((p) => { const a = Math.min(1, (now - p.born) / 800); return { v: p.v, label: p.label || ('+$' + p.v), x: Math.round(p.x0), y: Math.round(p.y0 - 50 * a), o: (1 - a).toFixed(2) }; }),
      setArena: this.setArena, setMe: this.setMe,
      onKeyDown: this.onKeyDown, onKeyUp: this.onKeyUp, onBlur: this.onBlur,
      leftDown: this.leftDown, leftUp: this.leftUp, rightDown: this.rightDown, rightUp: this.rightUp, jumpTap: this.jumpTap,
      start1: this.start1, start2: this.start2, restart: this.restart, other: this.other, finish: this.finish, play: this.play, pickEasy: this.pickEasy, pickHard: this.pickHard, menu: this.menu, go2: this.go2, cancelIntro: this.cancelIntro
    };
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Component, {"theme": "auto", "amountFont": "Press Start 2P", "roundSeconds": "30"}));
</script>
